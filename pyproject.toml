[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-subtitle-creator"
version = "1.0.0"
description = "Create SRT subtitles for guitar backing tracks with visual waveform"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Guitar Subtitle Creator"}
]
keywords = ["subtitle", "srt", "music", "guitar", "backing track", "waveform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "python-vlc>=3.0.0",
    "pysrt>=1.1.0",
    "numpy>=1.20.0",
]

[project.scripts]
guitar-subs = "main:main"

[project.urls]
Homepage = "https://github.com/yourusername/guitar-subtitle-creator"
